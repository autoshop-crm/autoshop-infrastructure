limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

upstream core_upstream {
    server core:8080;
}

upstream auth_upstream {
    server auth:8082;
}

upstream files_upstream {
    server files:8084;
}

upstream notification_upstream {
    server notification:8083;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss;

    location = /health/nginx {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location /api/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://auth_upstream/api/auth/;
        include /etc/nginx/proxy_params;
    }

    location /api/files/ {
        proxy_pass http://files_upstream/api/files/;
        include /etc/nginx/proxy_params;
    }

    location /internal/notification/actuator/health {
        proxy_pass http://notification_upstream/actuator/health;
        include /etc/nginx/proxy_params;
    }

    location /internal/files/actuator/health {
        proxy_pass http://files_upstream/actuator/health;
        include /etc/nginx/proxy_params;
    }

    location /internal/core/actuator/health {
        proxy_pass http://core_upstream/actuator/health;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://core_upstream;
        include /etc/nginx/proxy_params;
    }
}
