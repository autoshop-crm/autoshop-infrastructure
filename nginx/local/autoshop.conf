upstream core_upstream {
    server core:8080;
}

upstream auth_upstream {
    server auth:8082;
}

upstream files_upstream {
    server files:8084;
}

upstream notification_upstream {
    server notification:8083;
}

upstream web_spec_upstream {
    server web-spec:4173;
}

upstream client_web_upstream {
    server client-web:4174;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health/nginx {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location /api/auth/ {
        proxy_pass http://auth_upstream/api/auth/;
    }

    location /auth/ {
        proxy_pass http://auth_upstream/api/auth/;
    }

    location /api/files/ {
        proxy_pass http://files_upstream/api/files/;
    }

    location = /api/files {
        proxy_pass http://files_upstream/api/files;
    }

    location /files/ {
        proxy_pass http://files_upstream/api/files/;
    }

    location = /files {
        proxy_pass http://files_upstream/api/files;
    }

    location /internal/notification/actuator/health {
        proxy_pass http://notification_upstream/actuator/health;
    }

    location /internal/files/actuator/health {
        proxy_pass http://files_upstream/actuator/health;
    }

    location /internal/core/actuator/health {
        proxy_pass http://core_upstream/actuator/health;
    }

    location / {
        proxy_pass http://core_upstream;
    }
}

server {
    listen 81;
    server_name _;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health/nginx {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location /api/admin/ {
        proxy_pass http://auth_upstream/api/admin/;
    }

    location /api/auth/ {
        proxy_pass http://auth_upstream/api/auth/;
    }

    location /api/files/ {
        proxy_pass http://files_upstream/api/files/;
    }

    location = /api/files {
        proxy_pass http://files_upstream/api/files;
    }

    location /api/ {
        proxy_pass http://core_upstream/api/;
    }

    location / {
        proxy_pass http://web_spec_upstream;
    }
}

server {
    listen 82;
    server_name _;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health/nginx {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location /api/auth/ {
        proxy_pass http://auth_upstream/api/auth/;
    }

    location /api/files/ {
        proxy_pass http://files_upstream/api/files/;
    }

    location = /api/files {
        proxy_pass http://files_upstream/api/files;
    }

    location /api/ {
        proxy_pass http://core_upstream/api/;
    }

    location / {
        proxy_pass http://client_web_upstream;
    }
}
