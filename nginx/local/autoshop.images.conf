upstream core_upstream {
    server core:8080;
}

upstream auth_upstream {
    server auth:8082;
}

upstream files_upstream {
    server files:8084;
}

upstream notification_upstream {
    server notification:8083;
}

upstream web_spec_upstream {
    server web-spec:80;
}

upstream client_web_upstream {
    server client-web:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health/nginx {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location = / {
        default_type text/html;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoShop Demo</title><style>body{font-family:Arial,sans-serif;background:#111827;color:#f9fafb;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}.wrap{max-width:720px;padding:32px}.card{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.25)}h1{margin:0 0 12px;font-size:32px}p{color:#d1d5db;line-height:1.5}.actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-block;padding:14px 20px;border-radius:10px;text-decoration:none;font-weight:600}.btn-client{background:#22c55e;color:#052e16}.btn-crm{background:#60a5fa;color:#172554}</style></head><body><div class="wrap"><div class="card"><h1>AutoShop Demo</h1><p>Выберите интерфейс для демонстрации.</p><div class="actions"><a class="btn btn-client" href="/client/">Клиентский кабинет</a><a class="btn btn-crm" href="/crm/">CRM / Рабочий кабинет</a></div></div></div></body></html>';
    }

    location = /crm {
        return 302 /crm/;
    }

    location = /client {
        return 302 /client/;
    }

    location /crm/assets/ {
        proxy_pass http://web_spec_upstream/assets/;
    }

    location /client/assets/ {
        proxy_pass http://client_web_upstream/assets/;
    }

    location /crm/ {
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter 'href="/' 'href="/crm/';
        sub_filter 'src="/' 'src="/crm/';
        proxy_pass http://web_spec_upstream/;
    }

    location /client/ {
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter 'href="/' 'href="/client/';
        sub_filter 'src="/' 'src="/client/';
        proxy_pass http://client_web_upstream/;
    }

    location /api/auth/ {
        proxy_pass http://auth_upstream/api/auth/;
    }

    location /auth/ {
        proxy_pass http://auth_upstream/api/auth/;
    }

    location /api/files/ {
        proxy_pass http://files_upstream/api/files/;
    }

    location = /api/files {
        proxy_pass http://files_upstream/api/files;
    }

    location /files/ {
        proxy_pass http://files_upstream/api/files/;
    }

    location = /files {
        proxy_pass http://files_upstream/api/files;
    }

    location /internal/notification/actuator/health {
        proxy_pass http://notification_upstream/actuator/health;
    }

    location /internal/files/actuator/health {
        proxy_pass http://files_upstream/actuator/health;
    }

    location /internal/core/actuator/health {
        proxy_pass http://core_upstream/actuator/health;
    }

    location / {
        proxy_pass http://core_upstream;
    }
}

server {
    listen 81;
    server_name _;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health/nginx {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location /api/admin/ {
        proxy_pass http://auth_upstream/api/admin/;
    }

    location /api/auth/ {
        proxy_pass http://auth_upstream/api/auth/;
    }

    location /api/files/ {
        proxy_pass http://files_upstream/api/files/;
    }

    location = /api/files {
        proxy_pass http://files_upstream/api/files;
    }

    location /api/ {
        proxy_pass http://core_upstream/api/;
    }

    location / {
        proxy_pass http://web_spec_upstream;
    }
}

server {
    listen 82;
    server_name _;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health/nginx {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location /api/auth/ {
        proxy_pass http://auth_upstream/api/auth/;
    }

    location /api/files/ {
        proxy_pass http://files_upstream/api/files/;
    }

    location = /api/files {
        proxy_pass http://files_upstream/api/files;
    }

    location /api/ {
        proxy_pass http://core_upstream/api/;
    }

    location / {
        proxy_pass http://client_web_upstream;
    }
}
