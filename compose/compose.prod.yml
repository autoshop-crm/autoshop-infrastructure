services:
  mailhog:
    image: ${MAILHOG_IMAGE}
    restart: unless-stopped
    profiles:
      - mailhog
    ports:
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - autoshop

  auth:
    env_file:
      - ${ENV_DIR}/infrastructure.env
      - ${ENV_DIR}/auth.env

  core:
    env_file:
      - ${ENV_DIR}/infrastructure.env
      - ${ENV_DIR}/core.env

  notification:
    env_file:
      - ${ENV_DIR}/infrastructure.env
      - ${ENV_DIR}/notification.env

  files:
    env_file:
      - ${ENV_DIR}/infrastructure.env
      - ${ENV_DIR}/files.env

  web-spec:
    image: ${WEB_SPEC_IMAGE}:${WEB_SPEC_IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - autoshop

  client-web:
    image: ${CLIENT_WEB_IMAGE}:${CLIENT_WEB_IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/client/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - autoshop

  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    depends_on:
      - core
      - auth
      - notification
      - files
      - web-spec
      - client-web
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${WEB_SPEC_PUBLIC_PORT:-5173}:81"
      - "${CLIENT_WEB_PUBLIC_PORT:-5174}:82"
    volumes:
      - ${NGINX_CONF}:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/proxy_params:/etc/nginx/proxy_params:ro
    networks:
      - autoshop
