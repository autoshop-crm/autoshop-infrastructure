volumes:
  web_spec_node_modules:
  web_spec_npm_cache:
  client_web_node_modules:
  client_web_npm_cache:

services:
  postgres:
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5433}:5432"

  redis:
    ports:
      - "${REDIS_PUBLIC_PORT:-6379}:6379"

  kafka:
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"

  minio:
    ports:
      - "${MINIO_API_PUBLIC_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PUBLIC_PORT:-9001}:9001"

  mailhog:
    image: ${MAILHOG_IMAGE}
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - autoshop

  auth:
    env_file:
      - ${ENV_DIR}/infrastructure.env
      - ${ENV_DIR}/auth.env
    ports:
      - "${AUTH_PUBLIC_PORT:-8082}:8082"

  core:
    env_file:
      - ${ENV_DIR}/infrastructure.env
      - ${ENV_DIR}/core.env
    ports:
      - "${CORE_PUBLIC_PORT:-8080}:8080"

  notification:
    env_file:
      - ${ENV_DIR}/infrastructure.env
      - ${ENV_DIR}/notification.env
    depends_on:
      mailhog:
        condition: service_started
    ports:
      - "${NOTIFICATION_PUBLIC_PORT:-8083}:8083"

  files:
    env_file:
      - ${ENV_DIR}/infrastructure.env
      - ${ENV_DIR}/files.env
    ports:
      - "${FILES_PUBLIC_PORT:-8084}:8084"

  web-spec:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "npm ci &&
      npm run build &&
      npm run preview -- --host 0.0.0.0 --port 4173"
    environment:
      VITE_GATEWAY_BASE_URL: ""
    volumes:
      - ${WEB_SPEC_SOURCE_DIR}:/app
      - web_spec_node_modules:/app/node_modules
      - web_spec_npm_cache:/root/.npm
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - autoshop

  client-web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "npm ci &&
      npm run build &&
      npm run preview -- --host 0.0.0.0 --port 4174"
    environment:
      VITE_GATEWAY_BASE_URL: ""
      VITE_ENABLE_AUTH_MOCK: "false"
    volumes:
      - ${CLIENT_WEB_SOURCE_DIR}:/app
      - client_web_node_modules:/app/node_modules
      - client_web_npm_cache:/root/.npm
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4174 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - autoshop

  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    depends_on:
      - core
      - auth
      - notification
      - files
      - web-spec
      - client-web
    ports:
      - "${NGINX_HTTP_PORT:-8088}:80"
      - "${WEB_SPEC_PUBLIC_PORT:-5173}:81"
      - "${CLIENT_WEB_PUBLIC_PORT:-5174}:82"
    volumes:
      - ${NGINX_CONF}:/etc/nginx/conf.d/default.conf:ro
      - ${ROOT_DIR:-.}/nginx/proxy_params:/etc/nginx/proxy_params:ro
    networks:
      - autoshop
